[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bev-osm"
version = "0.1.0"
description = "MIA BEV-conditioned pixel and latent OSM raster generation"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.24,<3", "scipy>=1.10", "Pillow>=10", "PyYAML>=6"]
[project.optional-dependencies]
mia = ["torchvision>=0.20", "omegaconf>=2.3", "torchmetrics>=1.4", "opencv-python-headless>=4.8", "einops>=0.7", "matplotlib>=3.8"]
[tool.setuptools.packages.find]
include = ["bev_osm*"]
